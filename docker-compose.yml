services:
  backend:
    build:
      context: ./backend
    container_name: fastapi-jwt-backend
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: flowops-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
